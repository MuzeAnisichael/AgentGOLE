[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golekit"
version = "0.3.0.dev0"
description = "An asynchronous agent kernel for local and hosted language models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx", "pydantic>=2", "pyyaml"]

[project.optional-dependencies]
rag = ["pypdf", "python-docx", "numpy"]
all = ["golekit[rag]"]

[project.scripts]
gole = "golekit.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "pyright"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py", "*.pyi", "pyproject.toml"]
extend-exclude = [".worktrees", ".dev-tools", ".uv-cache"]

[tool.pyright]
include = ["src", "examples", "tests"]
strict = ["src/golekit/protocols", "src/golekit/kernel"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not live"'
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires a real model endpoint"]
